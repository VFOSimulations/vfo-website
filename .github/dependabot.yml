version: 2
updates:
  # npm dependencies (React, Vite, oxlint, …)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps to keep noise down.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — keeps the SHA-pinned actions in deploy.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
